name: fabric_detector_app
description: "Detector de defectos en telas usando ONNX Runtime / TFLite"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  camera: ^0.10.5
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # IA
  onnxruntime: ^1.4.1
  tflite_flutter: ^0.10.4
  image: ^4.1.3
  
  # UI/Utilidades
  file_picker: ^6.1.1
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.2
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
