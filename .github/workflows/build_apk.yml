name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          
      - name: Generate Platform Files
        run: |
          flutter create .
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          # Inyectar permiso de lectura (necesario para file_picker en algunas versiones)
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
        working-directory: ./fabric_detector_app

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./fabric_detector_app
        
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        working-directory: ./fabric_detector_app
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: fabric_detector_app/build/app/outputs/flutter-apk/app-release.apk
